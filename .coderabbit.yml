version: 1
rules:
  ignore:
    - "target/**"
    - "**/*.class"
    - "**/*.jar"
    - ".vscode/**"
review:
  max_pr_files: 200
  max_file_size_kb: 500
  languages: ["java", "xml", "yaml", "md"]
  severity_threshold: "medium"
  path_filters:
    include:
      - "src/**"
      - "pom.xml"
      - "README.md"
    exclude:
      - "target/**"
workflows:
  auto_review:
    on:
      - pull_request_opened
      - pull_request_synchronize
    actions:
      - review
settings:
  leave_review_summary: true
  suggest_fixes: true
  request_changes_on_high_severity: true
  add_labels:
    - "ai-reviewed"

